<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>GRAF Barbershop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000000;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px 16px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    /* ЛОГОТИП */
    .logo {
      width: 125px;
      height: 125px;

      margin: 0 auto 22px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* НАЗВАНИЕ */
    h1 {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: 5px;

      margin-bottom: 8px;
    }

    .subtitle {
      color: #bdbdbd;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;

      margin-bottom: 28px;
    }

    /* ГРАДИЕНТНАЯ ЛИНИЯ */
    .gradient-line {
      width: 80px;
      height: 2px;

      margin: 0 auto 20px;

      background: linear-gradient(
        90deg,
        #FF4E00,
        #FFAA00
      );

      border-radius: 10px;
    }

    /* КНОПКИ */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .button {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 58px;
      padding: 16px 20px;

      border-radius: 14px;

      text-decoration: none;
      color: #ffffff;

      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;

      background: #111111;

      border: 1px solid rgba(255, 130, 0, 0.45);

      transition: all 0.2s ease;

      overflow: hidden;
    }

    .button::before {
      content: "";

      position: absolute;
      inset: 0;

      background: linear-gradient(
        90deg,
        rgba(255, 78, 0, 0.10),
        rgba(255, 170, 0, 0.08)
      );

      opacity: 0;

      transition: opacity 0.2s ease;
    }

    .button:hover::before {
      opacity: 1;
    }

    .button:hover {
      transform: translateY(-2px);

      border-color: #FF8500;

      box-shadow:
        0 7px 25px rgba(255, 85, 0, 0.18);
    }

    .button:active {
      transform: scale(0.98);
    }

    .icon {
      position: absolute;
      left: 20px;

      font-size: 20px;
    }

    /* КНОПКА ТЕЛЕФОНА */
    .phone {
      background: linear-gradient(
        90deg,
        #FF4E00,
        #FFAA00
      );

      color: #000000;

      border: none;

      box-shadow:
        0 8px 30px rgba(255, 85, 0, 0.25);
    }

    .phone:hover {
      border: none;

      box-shadow:
        0 10px 35px rgba(255, 85, 0, 0.35);
    }

    /* НИЗ */
    .footer {
      margin-top: 28px;

      color: #666666;

      font-size: 11px;
      letter-spacing: 1.5px;

      text-transform: uppercase;
    }

    /* ТЕЛЕФОН */
    @media (max-width: 380px) {

      .logo {
        width: 110px;
        height: 110px;
      }

      h1 {
        font-size: 25px;
      }

      .button {
        min-height: 55px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- ЛОГОТИП -->
    <div class="logo">
      <img src="logo.png" alt="GRAF Barbershop">
    </div>

    <!-- НАЗВАНИЕ -->
    <h1>GRAF BARBERSHOP</h1>

    <div class="subtitle">
      DARXON
    </div>

    <div class="gradient-line"></div>

    <!-- КНОПКИ -->
    <div class="buttons">

      <!-- ТЕЛЕФОН -->
      <a
        class="button phone"
        href="tel:+998700189911"
      >
        <span class="icon">☎</span>
        Позвонить
      </a>

      <!-- INSTAGRAM -->
      <a
        class="button"
        href="https://www.instagram.com/graf_barbershop/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">◎</span>
        Instagram
      </a>

      <!-- TELEGRAM -->
      <a
        class="button"
        href="https://t.me/grafbarbershopdarxon"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">➤</span>
        Telegram
      </a>

      <!-- YANDEX -->
      <a
        class="button"
        href="https://yandex.uz/maps/-/CXeCvQJS"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">★</span>
        Яндекс Карты
      </a>

      <!-- GOOGLE -->
      <a
        class="button"
        href="https://maps.app.goo.gl/2faUqY1tj2U1N2Zc7"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">⌖</span>
        Google Maps
      </a>

    </div>

    <div class="footer">
      GRAF BARBERSHOP
    </div>

  </main>

</body>
</html>
